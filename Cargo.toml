[workspace]
resolver = "2"
members = [
    "crates/dsl-kit-core",
    "crates/dsl-kit-macros",
    "crates/dsl-kit-schema",
    "crates/dsl-kit-lint",
    "crates/dsl-kit-parse",
    "crates/dsl-kit-check",
    "crates/dsl-kit-fuzzy",
    "crates/dsl-kit",
    "crates/dsl-kit-mcp",
    "crates/dsl-kit-cli",
    "examples/flow-example",
    "examples/flow-example/crates/flow-dsl",
    "examples/flow-example/crates/flow-host",
    "examples/flow-example/crates/flow-mcp",
    "examples/expr-example",
    "examples/expr-example/crates/expr-dsl",
    "examples/expr-example/crates/expr-host",
    "examples/expr-example/crates/expr-mcp",
    "examples/cfg-example",
    "examples/cfg-example/crates/cfg-dsl",
    "examples/cfg-example/crates/cfg-host",
    "examples/cfg-example/crates/cfg-mcp",
    "examples/custom-mcp-example",
]

[workspace.package]
version = "0.10.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Yutaka Nishimura <ytk.nishimura@gmail.com>"]
repository = "https://github.com/ynishi/dsl-kit"
homepage = "https://github.com/ynishi/dsl-kit"
readme = "README.md"
keywords = ["dsl", "ai", "mcp", "parser", "engine"]
categories = ["parser-implementations", "development-tools"]
rust-version = "1.85"

[workspace.dependencies]
dsl-kit-core   = { path = "crates/dsl-kit-core", version = "0.10.0" }
dsl-kit-macros = { path = "crates/dsl-kit-macros", version = "0.10.0" }
dsl-kit-schema = { path = "crates/dsl-kit-schema", version = "0.10.0" }
dsl-kit-lint   = { path = "crates/dsl-kit-lint", version = "0.10.0" }
dsl-kit-parse  = { path = "crates/dsl-kit-parse", version = "0.10.0" }
dsl-kit-check  = { path = "crates/dsl-kit-check", version = "0.10.0" }
# Path-only (no version): fuzzy is consumed only as a dev-dependency
# (parse / mcp).  Version-less path dev-deps are stripped by `cargo publish`,
# while a version pin makes the publish verify step resolve fuzzy against
# the registry — and release-plz excludes dev-deps from its publish order
# (release-plz#2697), so the pinned form deadlocks the release when fuzzy
# is scheduled after its consumers (v0.5.1 incident, 2026-07-26).
dsl-kit-fuzzy  = { path = "crates/dsl-kit-fuzzy" }
dsl-kit        = { path = "crates/dsl-kit", version = "0.10.0" }
dsl-kit-mcp    = { path = "crates/dsl-kit-mcp", version = "0.10.0" }
dsl-kit-cli    = { path = "crates/dsl-kit-cli", version = "0.10.0" }
# Example sub-crates are workspace-internal + publish = false.  A pinned
# `version = "…"` here is a dead constraint on the registry side (they are
# never published), and it actively blocks release-plz: when the workspace
# bumps to 0.M.0 the pin still reads 0.4.0 and cargo update fails to
# resolve the sub-crate.  Path-only.
flow-dsl       = { path = "examples/flow-example/crates/flow-dsl"  }
flow-host      = { path = "examples/flow-example/crates/flow-host" }
expr-dsl       = { path = "examples/expr-example/crates/expr-dsl"  }
expr-host      = { path = "examples/expr-example/crates/expr-host" }
cfg-dsl        = { path = "examples/cfg-example/crates/cfg-dsl"    }
cfg-host       = { path = "examples/cfg-example/crates/cfg-host"   }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
