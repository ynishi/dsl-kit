[workspace]
resolver = "2"
members = [
    "crates/dsl-kit-core",
    "crates/dsl-kit-macros",
    "crates/dsl-kit-schema",
    "crates/dsl-kit-lint",
    "crates/dsl-kit-parse",
    "crates/dsl-kit-fuzzy",
    "crates/dsl-kit",
    "crates/dsl-kit-mcp",
    "crates/dsl-kit-cli",
    "examples/flow-example",
    "examples/flow-example/crates/flow-dsl",
    "examples/flow-example/crates/flow-host",
    "examples/flow-example/crates/flow-mcp",
    "examples/expr-example",
    "examples/expr-example/crates/expr-dsl",
    "examples/expr-example/crates/expr-host",
    "examples/expr-example/crates/expr-mcp",
    "examples/custom-mcp-example",
]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["Yutaka Nishimura <ytk.nishimura@gmail.com>"]
repository = "https://github.com/ynishi/dsl-kit"
homepage = "https://github.com/ynishi/dsl-kit"
readme = "README.md"
keywords = ["dsl", "ai", "mcp", "parser", "engine"]
categories = ["parser-implementations", "development-tools"]
rust-version = "1.85"

[workspace.dependencies]
dsl-kit-core   = { path = "crates/dsl-kit-core",   version = "0.3.0" }
dsl-kit-macros = { path = "crates/dsl-kit-macros", version = "0.3.0" }
dsl-kit-schema = { path = "crates/dsl-kit-schema", version = "0.3.0" }
dsl-kit-lint   = { path = "crates/dsl-kit-lint",   version = "0.3.0" }
dsl-kit-parse  = { path = "crates/dsl-kit-parse",  version = "0.3.0" }
dsl-kit-fuzzy  = { path = "crates/dsl-kit-fuzzy",  version = "0.3.0" }
dsl-kit        = { path = "crates/dsl-kit",        version = "0.3.0" }
dsl-kit-mcp    = { path = "crates/dsl-kit-mcp",    version = "0.3.0" }
dsl-kit-cli    = { path = "crates/dsl-kit-cli",    version = "0.3.0" }
flow-dsl       = { path = "examples/flow-example/crates/flow-dsl",  version = "0.3.0" }
flow-host      = { path = "examples/flow-example/crates/flow-host", version = "0.3.0" }
expr-dsl       = { path = "examples/expr-example/crates/expr-dsl",  version = "0.3.0" }
expr-host      = { path = "examples/expr-example/crates/expr-host", version = "0.3.0" }
