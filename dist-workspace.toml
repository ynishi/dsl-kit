[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
# Intentionally empty: no Homebrew tap, no shell/powershell installer, no
# cargo-install installer, no Docker. cargo-dist just uploads platform
# archives to the GitHub Release; users grab the binary manually or via
# `cargo install dsl-kit-cli` from crates.io (which release-plz handles).
installers = []
# Target platforms to build apps for (Rust target-triple syntax).
# macOS + Linux stable only; no Windows (dsl-kit-cli MCP transport-io not
# validated on Windows shells).
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-gnu",
]
# Whether to install an updater program
install-updater = false
