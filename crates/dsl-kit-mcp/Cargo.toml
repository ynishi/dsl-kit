[package]
name = "dsl-kit-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
description = "MCP framework (stdio) for dsl-kit — handler + builder + DslHost trait. DSL-agnostic; ship your own DSL as a separate crate."

[dev-dependencies]
dsl-kit-fuzzy = { workspace = true }

[dependencies]
dsl-kit      = { workspace = true }
dsl-kit-lint = { workspace = true }
rmcp         = { version = "0.16", features = ["server", "transport-io", "macros"] }
tokio        = { version = "1", features = ["macros", "rt-multi-thread", "sync"] }
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
tracing      = "0.1"
schemars     = "0.8"
async-trait  = "0.1"
