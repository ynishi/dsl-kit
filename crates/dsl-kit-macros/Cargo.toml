[package]
name = "dsl-kit-macros"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true
description = "Derive macros for dsl-kit."

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
quote       = "1"
# extra-traits: Debug on syn types (DslCheckAttrs holds a syn::LitStr and
# unit tests debug-print it). Declared here so a `-p dsl-kit-macros` build
# does not depend on feature unification from sibling crates.
syn         = { version = "2", features = ["full", "extra-traits"] }
