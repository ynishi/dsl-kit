[package]
name = "expr-example"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Stdout demo for expr-dsl + expr-host. Runs the demo program synchronously and through DslHost, exercising the same handler expr-mcp uses."

[dependencies]
dsl-kit        = { workspace = true }
dsl-kit-mcp    = { workspace = true }
dsl-kit-parse  = { workspace = true }
dsl-kit-schema = { workspace = true }
expr-dsl       = { workspace = true }
expr-host      = { workspace = true }
async-trait  = "0.1"
miette       = { version = "7", features = ["fancy"] }
tokio        = { version = "1", features = ["macros", "rt-multi-thread"] }
