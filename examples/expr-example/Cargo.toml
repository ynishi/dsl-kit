[package]
name = "expr-example"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Second reference DSL for dsl-kit: a tiny arithmetic expression language with unbound-variable suspensions, wired to DslHost end to end."

[dependencies]
dsl-kit      = { workspace = true }
dsl-kit-core = { workspace = true }
dsl-kit-mcp  = { workspace = true }
async-trait  = "0.1"
miette       = { version = "7", features = ["fancy"] }
tokio        = { version = "1", features = ["macros", "rt-multi-thread"] }
