[package]
name = "cfg-example"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "Stdout demo for cfg-dsl + cfg-host. Walks a keyed-slot document through text, JSON and the DslHost surface cfg-mcp serves."

[dependencies]
dsl-kit        = { workspace = true }
dsl-kit-mcp    = { workspace = true }
dsl-kit-parse  = { workspace = true }
dsl-kit-schema = { workspace = true }
cfg-dsl        = { workspace = true }
cfg-host       = { workspace = true }
miette       = { version = "7", features = ["fancy"] }
tokio        = { version = "1", features = ["macros", "rt-multi-thread"] }
