[package]
name = "cfg-host"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
description = "DslHost adapter around cfg-dsl. Third reference implementation, and the first one whose DSL has keyed child slots."

[dependencies]
dsl-kit         = { workspace = true }
dsl-kit-mcp     = { workspace = true }
dsl-kit-schema  = { workspace = true }
dsl-kit-lint    = { workspace = true }
dsl-kit-parse   = { workspace = true }
cfg-dsl         = { workspace = true }
async-trait     = "0.1"
serde_json      = "1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt"] }
rmcp  = { version = "0.16", features = ["server", "transport-io", "macros"] }
